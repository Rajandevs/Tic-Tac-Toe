<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main_body">
        <div class="wins">
            <div class="x_wins">X-Wins: <div class="x_win_count">0</div></div>
            <div class="reset" onclick="reset_score()">Reset Score</div>
            <div class="o_wins">O-Wins: <div class="o_win_count">0</div></div>
        </div>
        <div class="game_cont">
            <div class="box box1" onclick="clicked(1)"></div>
            <div class="box box2" onclick="clicked(2)"></div>
            <div class="box box3" onclick="clicked(3)"></div>
            <div class="box box4" onclick="clicked(4)"></div>
            <div class="box box5" onclick="clicked(5)"></div>
            <div class="box box6" onclick="clicked(6)"></div>
            <div class="box box7" onclick="clicked(7)"></div>
            <div class="box box8" onclick="clicked(8)"></div>
            <div class="box box9" onclick="clicked(9)"></div>
        </div>
        <div class="first_x">
            First Player is X
        </div>
        <div class="choose">Choose Your Symbol:
            <div class="choose_o_or_x">
                <div class="choose_x" onclick="Choose('X')">X</div>
                <div class="choose_o" onclick="Choose('O')">O</div>
            </div>
        </div>
        <div class="start">Start as </div>
        <div class="re_play_w_frn_play_comp">
            <div class='restart' onclick="location.reload()">Restart</div>
            <div class='play_with_frn play_with' onclick="frn()">Play With a Friend</div>
            <div class='play_with_comp play_with' onclick="comp()">Play Against Computer</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
